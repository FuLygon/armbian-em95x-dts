# The RTL8723BS is a combo chip: a BT firmware download during WiFi
# initialisation leaves the WiFi side unable to associate for 1.5-2 minutes
# (measured: 22 s without the BT firmware, 98-235 s with it, 15-26
# ASSOC-REJECT failures in between).  The same download later, with wlan0
# already associated, does not disturb the link.
#
# The BT core must still be powered and reset into ROM state before the WiFi
# side initialises; em95x-bt-power.sh drives GPIOX_17 for that.  Only the
# firmware download is deferred.
#
# "blacklist" blocks the automatic (alias/udev) load only; an explicit
# "modprobe hci_uart" still works, which is what em95x-bt-load.sh does once
# wlan0 is connected.
blacklist hci_uart
